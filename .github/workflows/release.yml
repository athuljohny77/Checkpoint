name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve version and skip published releases
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable semantic version is required.' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag must match package.json version.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          $release = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($release | ConvertFrom-Json).isDraft) {
            'skip=true' >> $env:GITHUB_OUTPUT
          } else { 'skip=false' >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci
      - name: Unit tests
        if: steps.version.outputs.skip != 'true'
        run: npm test
      - name: Desktop tests
        if: steps.version.outputs.skip != 'true'
        run: npm run test:e2e
      - name: Build portable and installer
        if: steps.version.outputs.skip != 'true'
        run: npm run build:release
      - name: Generate checksums
        if: steps.version.outputs.skip != 'true'
        run: node scripts/release-checksums.cjs
      - name: Publish tagged release with notes and binaries
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @("dist/Checkpoint-$env:RELEASE_VERSION-Windows.exe", "dist/Checkpoint-$env:RELEASE_VERSION-Setup.exe", 'dist/SHA256SUMS.txt')
          $notes = "release-notes/$env:RELEASE_TAG.md"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArguments = @('release','create',$env:RELEASE_TAG,'--draft','--target',$env:GITHUB_SHA,'--title',"Checkpoint $env:RELEASE_VERSION",'--generate-notes')
            if (Test-Path -LiteralPath $notes) { $releaseArguments += @('--notes-file',$notes) }
            gh @releaseArguments
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload every release asset; release remains a draft.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
